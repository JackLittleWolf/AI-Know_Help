<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b2fff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="64" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0d8ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Outer orbit ring -->
  <circle cx="32" cy="32" r="26" stroke="url(#ring)" stroke-width="1.2" stroke-dasharray="4 2.5" opacity="0.6" filter="url(#glow)"/>

  <!-- Inner orbit ring -->
  <circle cx="32" cy="32" r="19" stroke="#00d4ff" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.35"/>

  <!-- Corner circuit nodes -->
  <circle cx="32" cy="6"  r="1.8" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="58" cy="32" r="1.8" fill="#7b2fff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="32" cy="58" r="1.8" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="6"  cy="32" r="1.8" fill="#7b2fff" opacity="0.9" filter="url(#glow)"/>

  <!-- Connector lines from nodes to ring -->
  <line x1="32" y1="6"  x2="32" y2="13" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
  <line x1="58" y1="32" x2="51" y2="32" stroke="#7b2fff" stroke-width="0.8" opacity="0.5"/>
  <line x1="32" y1="58" x2="32" y2="51" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
  <line x1="6"  cy="32" x2="13" y2="32" stroke="#7b2fff" stroke-width="0.8" opacity="0.5"/>

  <!-- Central hexagon -->
  <polygon points="32,18 42,24 42,36 32,42 22,36 22,24"
           fill="none" stroke="url(#ring)" stroke-width="1.2" opacity="0.7" filter="url(#glow)"/>

  <!-- Hex inner fill glow -->
  <polygon points="32,20 40,25 40,35 32,40 24,35 24,25"
           fill="#0d1f4a" opacity="0.8"/>

  <!-- "AI" text -->
  <text x="32" y="34"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="13"
        font-weight="900"
        text-anchor="middle"
        fill="url(#text)"
        filter="url(#glow-strong)"
        letter-spacing="0.5">AI</text>

  <!-- Small scan line accent below text -->
  <line x1="26" y1="37" x2="38" y2="37" stroke="#00d4ff" stroke-width="0.8" opacity="0.6"/>
  <line x1="28" y1="39" x2="36" y2="39" stroke="#7b2fff" stroke-width="0.6" opacity="0.4"/>

  <!-- Diagonal circuit traces (top-right) -->
  <polyline points="44,12 50,12 50,18" fill="none" stroke="#00d4ff" stroke-width="0.7" opacity="0.4"/>
  <!-- Diagonal circuit traces (bottom-left) -->
  <polyline points="20,52 14,52 14,46" fill="none" stroke="#7b2fff" stroke-width="0.7" opacity="0.4"/>

  <!-- Small dot accents -->
  <circle cx="50" cy="18" r="1" fill="#00d4ff" opacity="0.7"/>
  <circle cx="14" cy="46" r="1" fill="#7b2fff" opacity="0.7"/>
</svg>
