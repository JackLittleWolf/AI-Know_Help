version: '3.9'

services:
  backend:
    build: ./backend
    container_name: ocr-backend
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ALLOWED_ORIGINS=["http://localhost","http://localhost:80"]
    ports:
      - "8000:8000"
    volumes:
      - /tmp/ocr_uploads:/tmp/ocr_uploads

  frontend:
    build: ./frontend
    container_name: ocr-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
